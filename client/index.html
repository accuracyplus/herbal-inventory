<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The colour of the phone's own bars: the app's top bar. appearance.js keeps it right for the palette and mode. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="HiFive Inventory — stock, requests, purchasing and linen." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!--
      The HiFive theme, applied before first paint (Design Guide Part J). theme-init.js and
      theme-defaults.js fall back to the copy in /theme-fallback/v1 if the design system's site
      is unreachable, without any inline script (the CSP allows none).
    -->
    <script src="https://hifive-design.pages.dev/theme/v1/boot.js"></script>
    <script src="/theme-init.js"></script>
    <script src="/theme-defaults.js"></script>
    <link rel="stylesheet" href="https://hifive-design.pages.dev/theme/v1/theme.css" />
    <!--
      The HiFive corner button and the suite's leave guard (Design Guide C21, D-053 and D-060 to
      D-062), the same script every HiFive app loads. If HiFive ID is unreachable it never loads
      and Inventory is as it was. src/leave.js is how Inventory uses it.
    -->
    <script src="https://hifive-id-portal.pages.dev/hub-button.js" defer></script>
    <!--
      HiFive ID's status check (Design Guide D-063, 21 Nov 2026) opens this page every 10 minutes
      and needs a 200 within 8 s, a title containing "HiFive Inventory", and a script under
      assets/index-. Before changing the title or the build's file names, tell the HiFive ID chat,
      or the hub shows Inventory as slow.
    -->
    <title>HiFive Inventory</title>
  </head>
  <!-- data-hf-keep-on-submit: a submitted form counts as unsaved until the server takes it (D-061). -->
  <body data-hf-keep-on-submit>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
