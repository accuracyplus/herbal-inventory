<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Inventory has moved</title>
<link rel="icon" href="https://hifive-inventory.pages.dev/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="https://hifive-inventory.pages.dev/favicon.svg" />
<link rel="apple-touch-icon" href="https://hifive-inventory.pages.dev/apple-touch-icon.png" />
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6470; --link: #0b5cad; --line: #e3e6ea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171b; --card: #1d2126; --text: #eef1f4; --muted: #a5adb7; --link: #7cb8ff; --line: #2c3238; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 420px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 20px; margin: 12px 0 4px; }
  p { margin: 4px 0; color: var(--muted); }
  a.go { display: inline-block; margin-top: 16px; font-weight: 600; color: var(--link); }
</style>
</head>
<body>
<main>
  <img src="https://hifive-inventory.pages.dev/favicon.svg" alt="" />
  <h1>Inventory has moved</h1>
  <p>Please use the new address, and update your bookmark.</p>
  <p lang="ml">ഇൻവെന്ററി ഇപ്പോൾ പുതിയ വിലാസത്തിലാണ്. ബുക്ക്മാർക്കും മാറ്റുക.</p>
  <a class="go" href="https://hifive-inventory.pages.dev/">hifive-inventory.pages.dev</a>
</main>
</body>
</html>
